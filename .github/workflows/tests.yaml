name: run pytest
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  build:
    name: pytest
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tub-msc/ordec-base:sha-f1b38fd
      options: --user root
    steps:
      - name: check out repository
        uses: actions/checkout@v4
      - name: Source venv
        run: |
          . /home/app/venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV
          echo SETUPTOOLS_SCM_PRETEND_VERSION="0" >> $GITHUB_ENV
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: pip install
        run: pip install .[test]
      # _gdsrecords is optional in setup.py: without a compiler, the build
      # succeeds without it and the tests pass on its slow Python fallback.
      # (The ORDB core _ordb is required; without it, the build fails.)
      - name: check that C extensions were built
        run: python3 -c "import ordec.layout._gdsrecords"
      - name: run tests
        run: pytest -v -o cache_dir=/tmp/pytestcache --junit-xml=/tmp/test-results.xml
      - name: display test results
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: /tmp/test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
