name: run pytest
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  build:
    name: pytest
    runs-on: ubuntu-latest
    # The flake as GitHub's source archive of this commit, not the checkout:
    # only the archive has the version in .git_archival.txt (see flake.nix).
    # build.yaml builds the image from the same, so that it has the same
    # ordec package as tested here.
    env:
      FLAKE: github:${{ github.repository }}/${{ github.sha }}
    steps:
      - name: check out repository
        uses: actions/checkout@v4
      - name: install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # Binary cache for what flake.nix builds itself (KLayout, Qt, Yosys,
      # the PDKs, ...), which cache.nixos.org does not have. Pushes what this
      # job builds; without the token (pull requests from forks), it only
      # pulls.
      - name: set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ordec
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The test shell has ordec as packaged by flake.nix (with the frontend
      # and the C extensions), with the tools of the ordec image. The tests
      # run against this installed package, not the checkout.
      - name: build test shell
        run: nix build -L -o /tmp/test-shell "$FLAKE#devShells.x86_64-linux.test"
      # faulthandler_timeout: a test hanging for 10 minutes dumps the stacks
      # of all threads into the log. The time limit applies only to the
      # tests: building the test shell takes one to two hours when the cache
      # lacks Qt, KLayout and Yosys, and that build fills the cache.
      - name: run tests
        timeout-minutes: 30
        run: nix develop "$FLAKE#test" -c pytest -v -o cache_dir=/tmp/pytestcache -o faulthandler_timeout=600 --junit-xml=/tmp/test-results.xml
      - name: display test results
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: /tmp/test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true
