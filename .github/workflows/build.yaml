name: ordec docker image
on:
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tub-msc/ordec

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # As in tests.yaml.
    env:
      FLAKE: github:${{ github.repository }}/${{ github.sha }}
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # As in tests.yaml.
      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ordec
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # flake.nix builds the image without Docker (dockerTools); the result is
      # a script that writes the image archive to stdout.
      - name: Build image
        run: |
          nix build -L -o /tmp/image "$FLAKE#image"
          /tmp/image | docker load
      # tests.yaml runs the test suite with the same ordec package and tools
      # (same store paths), so this only checks what is specific to the image:
      # the root file system, user, environment and start command.
      - name: Test image
        run: |
          docker run --rm ordec:latest sh -ec '
            test "$(id -un)" = app && touch ~/x /tmp/x
            python3 -c "import ordec.layout._gdsrecords"
            ngspice -v && klayout -b -v && magic --version && yosys -V && openvaf-r --version
            ls $(python3 -c "from ordec.lib import sky130, ihp130; sky130.pdk(); print(ihp130.pdk().ngspice_osdi_dir)")/psp103.osdi'
          docker run -d --name ordec-test -p 8100:8100 ordec:latest
          for i in $(seq 30); do curl -sf http://127.0.0.1:8100/app.html > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8100/app.html > /dev/null
          docker rm -f ordec-test
      # The version comes from .git_archival.txt in GitHub's archive (see
      # flake.nix); a stale archive would give a dev version here.
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          docker run --rm ordec:latest python3 -c "import ordec; v = ordec.__version__; assert v == '${GITHUB_REF_NAME#v}', v"
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker tag ordec:latest "$t"
            docker push "$t"
          done
