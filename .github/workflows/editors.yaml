name: editors
on:
  workflow_dispatch:
  push:
    paths:
      - 'support/editors/**'
      - 'src/ordec/ord/**'
      # repository .ord files are the corpus of the grammar oracle tests
      - 'src/ordec/**.ord'
      - 'tests/**.ord'
      - '.github/workflows/editors.yaml'
  pull_request:
    paths:
      - 'support/editors/**'
      - 'src/ordec/ord/**'
      # repository .ord files are the corpus of the grammar oracle tests
      - 'src/ordec/**.ord'
      - 'tests/**.ord'
      - '.github/workflows/editors.yaml'
jobs:
  grammars:
    name: grammar tests
    runs-on: ubuntu-latest
    env:
      # The shallow checkout has no tags for setuptools-scm.
      SETUPTOOLS_SCM_PRETEND_VERSION: "0"
    steps:
      - name: check out repository
        uses: actions/checkout@v4
      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: pip install
        run: pip install .[test-editors]
      - name: generate tree-sitter parser
        run: |
          cd support/editors/tree-sitter-ord
          npm ci --no-audit --no-fund
          npm run generate
      - name: tree-sitter corpus tests
        run: |
          cd support/editors/tree-sitter-ord
          npx tree-sitter test
      - name: grammar oracle tests
        run: pytest support/editors/tests -v
      - name: vscode extension tests
        run: |
          cd support/editors/vscode/ord
          npm run check
