[pytest]
minversion = 6.0
addopts =
    --ignore=support
    --tb=short
    # Parallel by default (worker count and web test grouping: see
    # tests/conftest.py). Pass -n 0 to run serially.
    -n auto --dist loadgroup
testpaths =
    tests
markers =
    web
    yosys
#tmp_path_retention_policy = failed
#tmp_path_retention_count = 3
filterwarnings =
    ignore:datetime.datetime.utcnow():DeprecationWarning
