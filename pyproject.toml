[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ordec"
maintainers = [
  {name = "Tobias Kaiser", email = "kaiser@tu-berlin.de"}
]
description = "ORDeC"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyrsistent>=0.18.1",
    "lark>=1.1.5",
    "astor>=0.8.1",
    "numpy>=1.24.2",
    "scipy>=1.10.1",
    "atpublic>=6.0.1",
    "markdown2>=2.4.0",
    "websockets>=17.0",
    "tabulate>=0.8.9",
    "inotify-simple>=1.3.0",
    "python-gdsii>=0.2.1",
    "sc-leflib>=0.5.1",
    "cbor2>=6.0.0",
]
dynamic = ["version"]
license = "Apache-2.0"
license-files = [
    "REUSE.toml",
    "LICENSES/Apache-2.0.txt",
    "LICENSES/OFL-1.1.txt",
    "LICENSES/CC0-1.0.txt",
    "LICENSES/MIT.txt",
]

[project.urls]
Homepage = "https://github.com/tub-msc/ordec"
Documentation = "https://ordec.readthedocs.io"

[project.optional-dependencies]
test = [
    "pytest>=7.2.1",
    "pytest-cov>=4.0.0",
    "selenium>=4.8.3",
    "pillow>=11.1.0",
]
extra = [
    "black>=23.1.0",
]

[project.scripts]
ordec = "ordec.__main__:main"
ordec-lsp = "ordec.lsp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ordec.ord" = ["*.lark"]
"ordec.layout" = ["*.lark"]
"ordec.examples" = ["*.json", "*.ord"]
"ordec.courses.getting_started" = ["*.json", "*.ord"]
"ordec.courses.cmos_circuits" = ["*.json", "*.ord"]
"ordec.courses.layout_tutorial" = ["*.json", "*.ord"]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"

# Map installed-package paths back to the source tree, so coverage collected
# against a non-editable install (as in CI) reports on src/ordec/.
[tool.coverage.paths]
source = [
    "src/ordec",
    "*/site-packages/ordec",
]
