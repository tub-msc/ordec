<!-- VS Code shows language icons as a left-anchored 16px background image, while
     Seti (the default file icon theme) renders its icons as font glyphs centered
     in a 19.5px em box. The viewBox is therefore enlarged (glyph fills ~75% of the
     frame) and shifted so the ink centers at 9.75px like Seti's glyphs, instead of
     at 8px, which would look left-shifted next to them. -->
