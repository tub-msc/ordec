# Default LayoutStyle of SG13G2 (see ordec/layout/style.py for the format).
# To customize it, put the settings and layers to change into
# ~/.config/ordec/layout/ihp-sg13g2.toml.

background = "#000000"
blend = "additive"
opacity = 1.0

# Drawing order, bottom first: markers, then wells and implants, then the
# rest, pin layers right above their layer.
[layers]
"IND.boundary" = { fill = "#ffff00" }
dfpad = { fill = "#5e00e6" }
EdgeSeal = { fill = "#5e00e6" }
EdgeSealBoundary = { stroke = "#5e00e6" }
Recog = { fill = "#bdcccc" }
prBoundary = { fill = "#9900e6", stroke = "#ff00ff" }
"Metal1.text" = { fill = "#39bfff" }
"Metal2.text" = { fill = "#ccccd9" }
"Metal3.text" = { fill = "#d80000" }
"Metal4.text" = { fill = "#93e837" }
"Metal5.text" = { fill = "#dcd146" }
"TopMetal1.text" = { fill = "#ffe6bf" }
"TopMetal2.text" = { fill = "#ff8000" }
"Activ.boundary" = { stroke = "#00ff00" }
"GatPoly.boundary" = { stroke = "#bf4026" }
